search:
  freshness: "pm"  # pd=past day, pw=past week, pm=past month, py=past year
  max_results_per_query: 20

  # Query templates: each is run against every site.
  # Use multiple templates to target different angles (location, tech, remote).
  query_templates:
    # Query A — Location-locked title search (city names, not "India")
    - name: location
      query: >
        ("Software Engineer" OR "Backend Engineer" OR "SDE" OR "Backend Developer")
        ("Bangalore" OR "Bengaluru" OR "Hyderabad" OR "Gurugram" OR "Gurgaon" OR "Pune" OR "Delhi" OR "Noida" OR "Chennai")
    # Query B — Tech-locked + location (catches Go roles regardless of title)
    - name: golang
      query: >
        ("Golang" OR "Go developer" OR "Go engineer")
        ("Bangalore" OR "Bengaluru" OR "Hyderabad" OR "Gurugram" OR "Gurgaon" OR "Pune" OR "Delhi" OR "Noida" OR "Chennai" OR "India")
    # Query C — TypeScript/Node.js + location (catches TS roles regardless of title)
    - name: typescript
      query: >
        ("TypeScript" OR "Node.js" OR "NodeJS" OR "NestJS")
        ("Bangalore" OR "Bengaluru" OR "Hyderabad" OR "Gurugram" OR "Gurgaon" OR "Pune" OR "Delhi" OR "Noida" OR "Chennai" OR "India")
    # Query D — Remote roles that specifically mention India
    - name: remote
      query: >
        ("Software Engineer" OR "Backend Engineer" OR "SDE")
        ("Remote" AND "India")

  sites:
    - boards.greenhouse.io
    - myworkdayjobs.com
    - lever.co
    - jobs.ashbyhq.com
    - jobs.smartrecruiters.com
    - cutshort.io
    - instahyre.com
    - wellfound.com

candidate_profile: |
  - 2 years of full-time post-graduation experience in backend/infra engineering
  - 2 years of prior contract experience during college (counts as profile depth, not toward YOE filters)
  - Primary language: Golang (production systems, internal tools, ABDM healthcare integration)
  - Secondary: TypeScript, Node.js, Python
  - Strong experience with: PostgreSQL, Redis, MongoDB, Docker, Kubernetes, AWS
  - Domain experience: Healthcare tech (ABDM/NHA certified), logistics, crypto/web3 infra
  - Built IAM systems, search infrastructure (Typesense), data pipelines (ClickHouse + PeerDB)
  - Comfortable with system design, DevOps, CI/CD, performance optimization
  - Education: B.Tech CSE, SRM (9.1 CGPA, 2024)
  - Location: India only. Open to on-site in Hyderabad, Bangalore, Gurugram, Delhi NCR, Pune, Chennai. Remote is fine only if the company/role is based in or hiring from India. Disqualify remote roles that require relocation outside India or are not available to India-based candidates.
  - Target: Junior to mid-level SDE/Backend roles
  - YOE fit: 2 yrs required = perfect | 3 yrs = comfortable applying | 4 yrs = stretch | 5+ = skip

filtering:
  min_score: 60
  prefilter:
    enabled: true
    # Page must contain at least one of these (case-insensitive) or it's skipped before AI scoring
    location_keywords:
      - india
      - bangalore
      - bengaluru
      - hyderabad
      - gurugram
      - gurgaon
      - pune
      - delhi
      - noida
      - chennai
      - remote
    # Jobs with these words in the title are skipped (too senior)
    skip_title_patterns:
      - senior
      - staff
      - principal
      - director

openai:
  model: "gpt-4o-mini"

recipient_email: "eshansingh2409@gmail.com"

schedule: "0 9 * * *"
