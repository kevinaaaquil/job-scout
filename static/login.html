<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Scout — Login</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --border: #475569;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --red: #ef4444;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px; width: 100%; max-width: 380px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text2); font-size: 0.85rem; margin-bottom: 24px; }
  label { display: block; font-size: 0.8rem; color: var(--text2); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; color: var(--text);
    font-size: 0.875rem; outline: none; margin-bottom: 16px;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; background: var(--accent); color: white; border: none;
    padding: 10px; border-radius: var(--radius); cursor: pointer;
    font-size: 0.875rem; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--red); font-size: 0.8rem; margin-bottom: 12px; display: none; }
</style>
</head>
<body>
<div class="login-card">
  <h1><span>Job</span> Scout</h1>
  <p class="subtitle">Sign in to continue</p>
  <p style="font-size:0.8rem;color:var(--text2);margin-bottom:16px;">Don't have credentials? <a href="mailto:me@eshansingh.net?subject=Job%20Scout%20—%20Login%20Request" style="color:var(--accent);text-decoration:none;">Request access</a></p>
  <div class="error" id="error"></div>
  <form id="loginForm">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" required autofocus>
    <label>Password</label>
    <div style="position:relative;">
      <input type="password" id="password" autocomplete="current-password" required style="padding-right:44px;margin-bottom:16px;">
      <button type="button" id="togglePw" style="position:absolute;right:8px;top:6px;width:auto;padding:4px 8px;background:var(--border);font-size:0.75rem;border-radius:4px;">Show</button>
    </div>
    <button type="submit" id="submitBtn">Sign In</button>
  </form>
</div>
<script>
document.getElementById('togglePw').addEventListener('click', () => {
  const pw = document.getElementById('password');
  const btn = document.getElementById('togglePw');
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Hide' : 'Show';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  btn.disabled = true;
  err.style.display = 'none';

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/';
    } else {
      err.textContent = data.error || 'Login failed';
      err.style.display = 'block';
    }
  } catch (ex) {
    err.textContent = 'Connection error';
    err.style.display = 'block';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
